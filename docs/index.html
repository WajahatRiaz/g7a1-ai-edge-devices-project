<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A1 baseline</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --ink: #171717;
      --muted: #6d6d6d;
      --line: #e6e6e3;
      --surface: #fff;
      --good: #1b7f4e;
      --bad: #a33b32;
      --prefill: #1b7f4e;
      --decode: #2c6490;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    header, main { width: min(1080px, calc(100% - 40px)); margin: 0 auto; }
    header { padding: 28px 0 0; }
    h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
    h2 { margin: 0 0 10px; font-size: 15px; font-weight: 600; }
    .kicker { margin: 0 0 6px; color: var(--muted); font-size: 12px; }
    .sub { margin: 6px 0 0; color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .chip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; color: var(--muted); font-size: 12px; background: var(--surface); }
    .chip strong { color: var(--ink); font-weight: 600; }
    .tabs { display: flex; gap: 2px; margin-top: 18px; border-bottom: 1px solid var(--line); }
    .tabs button, .dates button {
      font: inherit;
      cursor: pointer;
    }
    .tabs button {
      appearance: none;
      background: transparent;
      border: 0;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      padding: 8px 12px;
      color: var(--muted);
    }
    .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-top: 14px; }
    .dates { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
    .dates button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 10px; color: var(--muted); }
    .dates button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-size: 12px; font-weight: 600; }
    tr:last-child td { border-bottom: 0; }
    .num { text-align: right; }
    .good { color: var(--good); }
    .bad { color: var(--bad); }
    .delta { margin-left: 6px; font-size: 12px; }
    .note, .empty { color: var(--muted); }
    .note { font-size: 13px; margin: 8px 0 0; }
    code { font-family: ui-monospace, "SF Mono", ui-monospace, monospace; font-size: 12px; }
    ol.steps { margin: 8px 0 0; padding-left: 18px; }
    ol.steps li { margin: 6px 0; }
    .trace { width: 100%; height: auto; display: block; }
    .legend { display: flex; gap: 14px; color: var(--muted); font-size: 12px; margin-top: 8px; }
    .swatch { display: inline-block; width: 8px; height: 8px; margin-right: 5px; border-radius: 2px; }
    .bar-row { display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: center; margin: 7px 0; }
    .track { position: relative; height: 18px; background: #f3f3f1; border-radius: 4px; overflow: hidden; }
    .fill { height: 100%; }
    .fill span { position: absolute; right: 8px; top: 1px; font-size: 12px; }
    .fill.prefill { background: rgba(27, 127, 78, 0.22); }
    .fill.decode { background: rgba(44, 100, 144, 0.22); }
    footer { color: var(--muted); font-size: 12px; margin: 16px 0 36px; }
    @media (max-width: 720px) {
      header, main { width: min(1080px, calc(100% - 24px)); }
      .tabs { overflow-x: auto; }
    }
  </style>
</head>
<body>
  <header>
    <p class="kicker" id="kicker">AI624 · Project A1</p>
    <h1 id="title">Baseline</h1>
    <p class="sub" id="subtitle">Loading runs</p>
    <div class="chips" id="chips"></div>
  </header>
  <main id="main"></main>
  <script>
    const TABS = [
      ["overview", "Overview"],
      ["long_task", "Long task"],
      ["held_out", "Held-out"],
      ["sweep", "Sweep"],
    ];
    const KIND = {
      long_task: "Long task",
      held_out: "Held-out",
      sweep: "Sweep",
      power: "Power",
      harness: "Harness",
      train: "Train",
    };
    const state = {
      tab: (location.hash || "#overview").slice(1),
      picked: {},
    };
    if (!TABS.some(([id]) => id === state.tab)) state.tab = "overview";

    const $ = (id) => document.getElementById(id);

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[ch]));
    }

    function num(value, digits = 0) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) return "—";
      return Number(value).toLocaleString(undefined, {
        maximumFractionDigits: digits,
        minimumFractionDigits: digits,
      });
    }

    function ms(value) {
      return value === null || value === undefined ? "—" : `${num(value, value >= 100 ? 0 : 1)} ms`;
    }

    function toks(value) {
      return value === null || value === undefined ? "—" : `${num(value, 1)} tok/s`;
    }

    function bytes(value) {
      if (value === null || value === undefined) return "—";
      const mib = Number(value) / (1024 * 1024);
      return `${num(mib, mib >= 100 ? 0 : 1)} MiB`;
    }

    function joules(value) {
      return value === null || value === undefined ? "—" : `${num(value, 1)} J`;
    }

    function celsius(value) {
      return value === null || value === undefined ? "—" : `${num(value, 1)} °C`;
    }

    function median(values) {
      const nums = values.filter((value) => typeof value === "number" && !Number.isNaN(value)).sort((a, b) => a - b);
      if (!nums.length) return null;
      const mid = Math.floor(nums.length / 2);
      return nums.length % 2 ? nums[mid] : (nums[mid - 1] + nums[mid]) / 2;
    }

    function byDate(a, b) {
      return String(a.started_at || a.id).localeCompare(String(b.started_at || b.id));
    }

    function when(iso) {
      if (!iso) return "—";
      const date = new Date(iso);
      if (Number.isNaN(date.getTime())) return iso;
      return date.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    }

    function turnsOf(run) {
      return (run.sessions || []).flatMap((session) => session.turns || []);
    }

    function medianPrefill(run) {
      return median(turnsOf(run).map((turn) => turn.prefill_ms));
    }

    function medianDecode(run) {
      return median(turnsOf(run).map((turn) => turn.decode_ms));
    }

    function callStats(run) {
      const ok = (run.sessions || []).reduce((sum, session) => sum + (session.calls_ok || 0), 0);
      const total = (run.sessions || []).reduce((sum, session) => sum + (session.calls_total || 0), 0);
      return { ok, total };
    }

    function delta(current, previous, lowerIsBetter) {
      if (typeof current !== "number" || typeof previous !== "number" || previous === 0) return "";
      const pct = ((current - previous) / Math.abs(previous)) * 100;
      const rounded = Math.round(pct);
      if (rounded === 0) return "";
      const improved = lowerIsBetter ? rounded < 0 : rounded > 0;
      const sign = rounded > 0 ? "+" : "";
      return `<span class="delta ${improved ? "good" : "bad"}">${sign}${rounded}%</span>`;
    }

    function previousOf(runs) {
      const map = {};
      const last = {};
      [...runs].sort(byDate).forEach((run) => {
        map[run.id] = last[run.kind] || null;
        last[run.kind] = run;
      });
      return map;
    }

    function tabs() {
      return `<nav class="tabs">${TABS.map(([id, label]) =>
        `<button type="button" data-tab="${id}" aria-selected="${state.tab === id}">${label}</button>`
      ).join("")}</nav>`;
    }

    function dateStrip(runs, kind) {
      if (!runs.length) return "";
      const current = selected(runs, kind);
      return `<div class="dates">${[...runs].sort(byDate).map((run) =>
        `<button type="button" data-kind="${esc(kind)}" data-run="${esc(run.id)}" aria-pressed="${run.id === current.id}">${esc(when(run.started_at))}</button>`
      ).join("")}</div>`;
    }

    function selected(runs, kind) {
      const ordered = [...runs].sort(byDate);
      const wanted = state.picked[kind];
      return ordered.find((run) => run.id === wanted) || ordered[ordered.length - 1];
    }

    function lineChart(series, yLabel, caption) {
      const points = series.flatMap((item) => item.points);
      if (points.length < 2) return "";
      const width = 720;
      const height = 200;
      const padL = 48;
      const padR = 12;
      const padT = 16;
      const padB = 28;
      const plotW = width - padL - padR;
      const plotH = height - padT - padB;
      const ys = points.map((point) => point.y);
      const yLo = Math.min(...ys);
      const yHi = Math.max(...ys);
      const span = (yHi - yLo) || 1;
      const min = yLo - span * 0.12;
      const max = yHi + span * 0.12;
      const labels = [];
      series.forEach((item) => item.points.forEach((point) => {
        if (!labels.includes(point.x)) labels.push(point.x);
      }));
      const xOf = (label) => {
        const index = Math.max(0, labels.indexOf(label));
        const denom = Math.max(1, labels.length - 1);
        return padL + (index / denom) * plotW;
      };
      const yOf = (value) => padT + (1 - (value - min) / (max - min)) * plotH;
      const paths = series.map((item) => {
        const path = item.points.map((point, index) =>
          `${index ? "L" : "M"}${xOf(point.x).toFixed(1)},${yOf(point.y).toFixed(1)}`
        ).join(" ");
        const dots = item.points.map((point) =>
          `<circle cx="${xOf(point.x).toFixed(1)}" cy="${yOf(point.y).toFixed(1)}" r="3" fill="${item.color}"/>`
        ).join("");
        return `<path d="${path}" fill="none" stroke="${item.color}" stroke-width="2"/>${dots}`;
      }).join("");
      const xLabels = labels.filter((_, index) => labels.length <= 6 || index === 0 || index === labels.length - 1 || index % Math.ceil(labels.length / 6) === 0);
      return `<svg class="trace" viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(yLabel)}">
        <line x1="${padL}" y1="${padT + plotH}" x2="${padL + plotW}" y2="${padT + plotH}" stroke="#e6e6e3"/>
        ${paths}
        <text x="4" y="14" fill="#6d6d6d" font-size="11">${esc(yLabel)}</text>
        <text x="${padL}" y="${height - 8}" fill="#6d6d6d" font-size="11">${esc(xLabels[0] || "")}</text>
        <text x="${padL + plotW}" y="${height - 8}" text-anchor="end" fill="#6d6d6d" font-size="11">${esc(xLabels[xLabels.length - 1] || "")}</text>
      </svg>
      <div class="legend">${series.map((item) => `<span><i class="swatch" style="background:${item.color}"></i>${esc(item.name)}</span>`).join("")}</div>
      <p class="note">${caption}</p>`;
    }

    function powerChart(device) {
      const points = ((device && device.series) || []).filter((point) => typeof point.t_s === "number");
      if (points.length < 2) return "";
      const width = 720;
      const height = 200;
      const padL = 46;
      const padR = 46;
      const padT = 16;
      const padB = 28;
      const plotW = width - padL - padR;
      const plotH = height - padT - padB;
      const tMax = Math.max(...points.map((point) => point.t_s), 1);
      const powers = points.map((point) => point.power_w).filter((value) => typeof value === "number");
      const temps = points.map((point) => point.temp_c).filter((value) => typeof value === "number");
      const domain = (lo, hi) => {
        const span = (hi - lo) || 1;
        return [lo - span * 0.18, hi + span * 0.18];
      };
      const pLo = powers.length ? Math.min(...powers) : 0;
      const pHi = powers.length ? Math.max(...powers) : 1;
      const cLo = temps.length ? Math.min(...temps) : 0;
      const cHi = temps.length ? Math.max(...temps) : 1;
      const [pMin, pMax] = domain(pLo, pHi);
      const [cMin, cMax] = domain(cLo, cHi);
      const xOf = (t) => padL + (t / tMax) * plotW;
      const yOf = (value, min, max) => padT + (1 - (value - min) / ((max - min) || 1)) * plotH;
      const pathFor = (key, min, max) => {
        let drawing = false;
        let path = "";
        points.forEach((point) => {
          if (typeof point[key] !== "number") {
            drawing = false;
            return;
          }
          path += `${drawing ? "L" : "M"}${xOf(point.t_s).toFixed(1)},${yOf(point[key], min, max).toFixed(1)} `;
          drawing = true;
        });
        return path.trim();
      };
      const marks = ((device && device.marks) || []).filter((mark) => typeof mark.t_s === "number").map((mark) => {
        const x = xOf(Math.max(0, Math.min(mark.t_s, tMax)));
        return `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${padT}" y2="${padT + plotH}" stroke="#8a5a12" stroke-dasharray="3 3"/>`;
      }).join("");
      return `<svg class="trace" viewBox="0 0 ${width} ${height}" role="img" aria-label="Power and temperature during the run">
        <line x1="${padL}" y1="${padT + plotH}" x2="${padL + plotW}" y2="${padT + plotH}" stroke="#e6e6e3"/>
        <path d="${pathFor("power_w", pMin, pMax)}" fill="none" stroke="#1b7f4e" stroke-width="2"/>
        <path d="${pathFor("temp_c", cMin, cMax)}" fill="none" stroke="#2c6490" stroke-width="2"/>
        ${marks}
        <text x="${padL}" y="12" fill="#6d6d6d" font-size="11">${num(pHi, 1)} W</text>
        <text x="${width - 8}" y="12" text-anchor="end" fill="#6d6d6d" font-size="11">${num(cHi, 1)} °C</text>
        <text x="${padL}" y="${height - 8}" fill="#6d6d6d" font-size="11">0s</text>
        <text x="${padL + plotW}" y="${height - 8}" text-anchor="end" fill="#6d6d6d" font-size="11">${num(tMax, 0)}s</text>
      </svg>
      <div class="legend"><span><i class="swatch" style="background:#1b7f4e"></i>power</span><span><i class="swatch" style="background:#2c6490"></i>temperature</span></div>
      <p class="note">Power (W) and temperature (°C) sampled about every ${num((device && device.interval_s) || 1, 0)}s for this run. Source: vcgencmd rail power and measure_temp.</p>`;
    }

    function deviceFacts(device) {
      if (!device) return "";
      const during = device.throttled_during || [];
      const since = device.throttled_since_boot || [];
      const throttle = during.length
        ? `${device.throttled || ""} during run: ${during.join(", ")}`
        : (since.length ? `${device.throttled || ""} since boot: ${since.join(", ")}` : "—");
      return `<p class="note">Peak RSS ${bytes(device.peak_memory_bytes)} · energy ${joules(device.energy_j)} · temp max ${celsius(device.temp_c_max)} · ${esc(throttle)}</p>`;
    }

    function sessionTable(run) {
      const sessions = run.sessions || [];
      if (!sessions.length) return "<p class='empty'>No harness sessions in this run.</p>";
      const rows = sessions.map((session) => {
        const sessionTurns = session.turns || [];
        const body = sessionTurns.map((turn) => {
          const ok = (turn.call_validity || []).filter((item) => item.ok).length;
          const total = (turn.call_validity || []).length;
          return `<tr>
            <td>${turn.turn_index ?? "—"}</td>
            <td class="num">${turn.prompt_tokens ?? "—"}</td>
            <td class="num">${ms(turn.prefill_ms)}</td>
            <td class="num">${ms(turn.decode_ms)}</td>
            <td class="num">${ms(turn.tool_ms)}</td>
            <td class="num">${total ? `${ok}/${total}` : "—"}</td>
          </tr>`;
        }).join("");
        return `<tr>
          <td><code>${esc(session.task_id)}</code></td>
          <td>${session.success === true ? '<span class="good">yes</span>' : session.success === false ? '<span class="bad">no</span>' : "n/a"}</td>
          <td class="num">${session.calls_total ? `${session.calls_ok}/${session.calls_total}` : "—"}</td>
          <td class="num">${sessionTurns.length}</td>
          <td class="num">${ms(sessionTurns.reduce((sum, turn) => sum + (turn.prefill_ms || 0), 0))}</td>
          <td class="num">${ms(sessionTurns.reduce((sum, turn) => sum + (turn.decode_ms || 0), 0))}</td>
        </tr>
        <tr><td colspan="6"><details><summary>Turns</summary>
          <table><thead><tr><th>Turn</th><th class="num">Prompt</th><th class="num">Prefill</th><th class="num">Decode</th><th class="num">Tool</th><th class="num">Calls</th></tr></thead><tbody>${body}</tbody></table>
        </details></td></tr>`;
      }).join("");
      return `<table><thead><tr><th>Task</th><th>Success</th><th class="num">Calls</th><th class="num">Turns</th><th class="num">Prefill</th><th class="num">Decode</th></tr></thead><tbody>${rows}</tbody></table>`;
    }

    function sweepBars(run) {
      const rows = (run.characterization && run.characterization.measurements) || [];
      if (!rows.length) return "<p class='empty'>No sweep measurements in this run.</p>";
      const max = Math.max(1, ...rows.flatMap((row) => [row.prompt_per_second || 0, row.predicted_per_second || 0]));
      const bars = rows.map((row) => `<div class="bar-row"><div>${row.prompt_n || row.requested_tokens_approx || "?"} tok</div><div>
        <div class="track"><div class="fill prefill" style="width:${((row.prompt_per_second || 0) / max) * 100}%"><span>${toks(row.prompt_per_second)}</span></div></div>
        <div class="track" style="margin-top:4px"><div class="fill decode" style="width:${((row.predicted_per_second || 0) / max) * 100}%"><span>${toks(row.predicted_per_second)}</span></div></div>
      </div></div>`).join("");
      return `${bars}
        <div class="legend"><span><i class="swatch" style="background:#1b7f4e"></i>prefill</span><span><i class="swatch" style="background:#2c6490"></i>decode</span></div>
        <p class="note">Prefill and decode throughput by prompt length. Source: llama-server timings, cache_prompt false.</p>`;
    }

    function sweepCompare(runs) {
      const ordered = [...runs].sort(byDate);
      if (ordered.length < 2) return "";
      const lengths = [];
      ordered.forEach((run) => ((run.characterization && run.characterization.measurements) || []).forEach((row) => {
        if (!lengths.includes(row.requested_tokens_approx)) lengths.push(row.requested_tokens_approx);
      }));
      lengths.sort((a, b) => a - b);
      const header = lengths.map((length) => `<th class="num">${length} decode</th>`).join("");
      let previous = null;
      const body = ordered.map((run) => {
        const cells = lengths.map((length) => {
          const row = ((run.characterization && run.characterization.measurements) || []).find((item) => item.requested_tokens_approx === length);
          const value = row ? row.predicted_per_second : null;
          const priorRow = previous && ((previous.characterization && previous.characterization.measurements) || []).find((item) => item.requested_tokens_approx === length);
          const prior = priorRow ? priorRow.predicted_per_second : null;
          return `<td class="num">${toks(value)}${delta(value, prior, false)}</td>`;
        }).join("");
        previous = run;
        return `<tr><td>${esc(when(run.started_at))}</td>${cells}</tr>`;
      }).join("");
      return `<h2>Decode throughput across dates</h2>
        <table><thead><tr><th>Run</th>${header}</tr></thead><tbody>${body}</tbody></table>
        <p class="note">Higher tok/s is better. The percent is versus the previous sweep at the same prompt length.</p>`;
    }

    function latencyTrend(runs) {
      const kinds = [
        ["long_task", "Long task", "#1b7f4e"],
        ["held_out", "Held-out", "#2c6490"],
      ];
      const series = kinds.map(([kind, name, color]) => ({
        name,
        color,
        points: runs.filter((run) => run.kind === kind).sort(byDate).flatMap((run) => {
          const y = medianPrefill(run);
          return typeof y === "number" ? [{ x: when(run.started_at), y }] : [];
        }),
      })).filter((item) => item.points.length);
      return lineChart(series, "Prefill (ms)", "Median prefill by run date. Lower is better. Source: harness turn timings.");
    }

    function kindTrend(runs, pick) {
      const points = [...runs].sort(byDate).flatMap((run) => {
        const y = pick(run);
        return typeof y === "number" ? [{ x: when(run.started_at), y }] : [];
      });
      return lineChart([{ name: "Median prefill", color: "#1b7f4e", points }], "Median prefill (ms)", "Same benchmark on later dates. Lower is better.");
    }

    function overview(runs, prior) {
      const chart = latencyTrend(runs);
      const rows = [...runs].sort(byDate).reverse().map((run) => {
        const previous = prior[run.id];
        const calls = callStats(run);
        return `<tr>
          <td>${esc(when(run.started_at))}</td>
          <td>${esc(KIND[run.kind] || run.kind)}</td>
          <td class="num">${calls.total ? `${calls.ok}/${calls.total}` : "—"}${delta(calls.total ? calls.ok / calls.total : null, previous && callStats(previous).total ? callStats(previous).ok / callStats(previous).total : null, false)}</td>
          <td class="num">${ms(medianPrefill(run))}${delta(medianPrefill(run), previous && medianPrefill(previous), true)}</td>
          <td class="num">${ms(medianDecode(run))}${delta(medianDecode(run), previous && medianDecode(previous), true)}</td>
          <td class="num">${joules(run.device && run.device.energy_j)}</td>
          <td class="num">${celsius(run.device && run.device.temp_c_max)}</td>
        </tr>`;
      }).join("");
      return `${chart ? `<section class="panel"><h2>Prefill over time</h2>${chart}</section>` : ""}
        <section class="panel"><h2>Every recorded run</h2>
          <table><thead><tr><th>Date</th><th>Tab</th><th class="num">Calls</th><th class="num">Prefill</th><th class="num">Decode</th><th class="num">Energy</th><th class="num">Temp max</th></tr></thead><tbody>${rows}</tbody></table>
          <p class="note">Percentages compare with the previous run of the same kind. Green means the later run improved.</p>
        </section>`;
    }

    function detail(runs, kind) {
      if (!runs.length) {
        return `<section class="panel"><p class="empty">No ${esc(KIND[kind] || kind)} runs yet.</p></section>`;
      }
      const run = selected(runs, kind);
      const trend = kind === "sweep" ? "" : kindTrend(runs, medianPrefill);
      const body = kind === "sweep"
        ? `${sweepBars(run)}${deviceFacts(run.device)}<div style="height:16px"></div>${sweepCompare(runs)}`
        : `${sessionTable(run)}${deviceFacts(run.device)}`;
      const command = (run.command || []).join(" ");
      return `<section class="panel">
        ${dateStrip(runs, kind)}
        <h2>${esc(when(run.started_at))}</h2>
        ${command ? `<p class="note"><code>${esc(command)}</code></p>` : ""}
        ${body}
        ${trend ? `<div style="height:8px"></div>${trend}` : ""}
        ${powerChart(run.device)}
      </section>`;
    }

    function steps() {
      return `<section class="panel"><h2>Record the next run</h2>
        <p class="note">Leave <code>./scripts/start_server.sh</code> running, then in a second terminal run <code>./scripts/run_baseline.sh</code>. It records the long task, the held-out sample, and the sweep, with power and temperature beside each one, and writes <code>docs/data/dashboard.json</code>.</p>
        <p class="note">Commit that file and push to update this page. Run the script again after a change; each run is kept by date.</p></section>`;
    }

    function render(data) {
      window.__data = data;
      const runs = Array.isArray(data.runs) ? data.runs : [];
      const baseline = data.baseline || {};
      const server = data.server || {};
      $("kicker").textContent = data.project ? `${data.project.course} · ${data.project.track}` : "AI624 · Project A1";
      $("title").textContent = data.project ? data.project.name : "Baseline";
      $("subtitle").textContent = runs.length
        ? `${runs.length} run${runs.length === 1 ? "" : "s"} · updated ${when(data.updated_at)}`
        : "No dated runs yet";
      $("chips").innerHTML = [
        ["model", `${baseline.model_family || "Qwen3"}-${baseline.model_size || "1.7B"}`],
        ["weights", server.model_ftype || "BF16"],
        ["context", server.n_ctx || baseline.context_size],
        ["cache_prompt", String(baseline.cache_prompt)],
      ].map(([label, value]) => `<span class="chip">${label} <strong>${esc(value)}</strong></span>`).join("");

      const prior = previousOf(runs);
      let body;
      if (!runs.length) body = steps();
      else if (state.tab === "overview") body = overview(runs, prior) + steps();
      else body = detail(runs.filter((run) => run.kind === state.tab), state.tab);
      $("main").innerHTML = `${tabs()}${body}<footer>Each run is kept. Export merges <code>results/baseline/history/</code> into <code>docs/data/dashboard.json</code>.</footer>`;
    }

    $("main").addEventListener("click", (event) => {
      const tab = event.target.closest("[data-tab]");
      if (tab) {
        state.tab = tab.dataset.tab;
        history.replaceState(null, "", `#${state.tab}`);
        render(window.__data);
        return;
      }
      const pick = event.target.closest("[data-run]");
      if (pick && window.__data) {
        state.picked[pick.dataset.kind] = pick.dataset.run;
        render(window.__data);
      }
    });

    fetch("data/dashboard.json", { cache: "no-store" })
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then(render)
      .catch((error) => {
        $("subtitle").textContent = `Could not load data/dashboard.json (${error.message}).`;
        $("main").innerHTML = steps();
      });
  </script>
</body>
</html>
