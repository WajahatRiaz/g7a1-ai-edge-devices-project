<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A1 baseline</title>
  <style>
    :root {
      --bg: #fff;
      --ink: #0d0d0d;
      --muted: #5d5d5d;
      --caption: #8f8f8f;
      --line: #0000001f;
      --surface: #fff;
      --surface-2: #f9f9f9;
      --surface-3: #f3f3f3;
      --chip-bg: #ededed;
      --good: #2c6732;
      --good-fill: #53b559;
      --bad: #92201d;
      --prefill: #3a843f;
      --prefill-ink: #14361a;
      --decode: #2c67c5;
      --decode-ink: #133463;
      --warn: #95611f;
      --radius: 12px;
      --radius-sm: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.625 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    header, main { width: min(68rem, calc(100% - 40px)); margin: 0 auto; }
    header { padding: 5rem 0 0; }
    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.15;
      max-width: 42rem;
    }
    h2 { margin: 0 0 12px; font-size: 1.05rem; font-weight: 600; letter-spacing: -0.01em; }
    .kicker { margin: 0 0 10px; color: var(--muted); font-size: 0.875rem; letter-spacing: 0.02em; }
    .sub { margin: 12px 0 0; color: var(--muted); font-size: 0.9375rem; max-width: 42rem; }
    .meta-line { margin: 16px 0 0; color: var(--caption); font-size: 0.8125rem; line-height: 1.5; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .chip {
      border-radius: 999px;
      padding: 4px 11px;
      color: var(--ink);
      font-size: 0.8125rem;
      background: var(--chip-bg);
      font-weight: 500;
    }
    .chip strong { font-weight: 600; }
    .tabs {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 2rem;
      padding: 3px;
      background: var(--chip-bg);
      border: 1px solid var(--line);
      border-radius: 999px;
    }
    .tabs button, .dates button {
      font: inherit;
      cursor: pointer;
    }
    .tabs button {
      appearance: none;
      background: transparent;
      border: 0;
      border-radius: 999px;
      padding: 8px 14px;
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 500;
    }
    .tabs button[aria-selected="true"] {
      color: var(--ink);
      background: var(--surface);
      box-shadow: 0 1px 2px #00000014;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px 22px;
      margin-top: 1.25rem;
    }
    .panel.hero-panel { border: 0; background: var(--surface-2); padding: 24px 26px; }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr));
      gap: 12px;
      margin: 4px 0 8px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 14px 14px 12px;
      min-height: 6.5rem;
    }
    .stat-label {
      margin: 0;
      color: var(--caption);
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1.35;
    }
    .stat-mult {
      margin: 8px 0 6px;
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--good);
    }
    .stat-mult.badish { color: var(--bad); }
    .stat-detail { margin: 0; color: var(--muted); font-size: 0.875rem; line-height: 1.4; font-variant-numeric: tabular-nums; }
    .dates { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; }
    .dates button {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 999px;
      padding: 6px 12px;
      color: var(--muted);
      font-size: 0.8125rem;
      font-weight: 500;
    }
    .run-meta {
      margin: 0 0 16px;
      color: var(--caption);
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.5;
    }
    .dates button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th {
      color: var(--caption);
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    tr:last-child td { border-bottom: 0; }
    .num { text-align: right; }
    .good { color: var(--good); }
    .bad { color: var(--bad); }
    .delta { margin-left: 6px; font-size: 0.75rem; font-weight: 600; }
    .note, .empty { color: var(--muted); }
    .note { font-size: 0.9375rem; margin: 10px 0 0; line-height: 1.55; max-width: 46rem; }
    code { font-family: ui-monospace, "SF Mono", ui-monospace, monospace; font-size: 0.8125rem; }
    .figure { margin: 4px 0 0; }
    .figure-caption {
      margin: 12px 0 0;
      color: var(--caption);
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      text-align: center;
    }
    ol.steps { margin: 8px 0 0; padding-left: 18px; }
    ol.steps li { margin: 6px 0; }
    .trace {
      width: 100%;
      height: auto;
      display: block;
      background: var(--surface-2);
      border-radius: var(--radius-sm);
    }
    .legend { display: flex; flex-wrap: wrap; gap: 14px; color: var(--muted); font-size: 0.8125rem; margin-top: 10px; }
    .swatch { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 2px; vertical-align: -1px; }
    .bar-row { display: grid; grid-template-columns: 72px 1fr; gap: 10px; align-items: center; margin: 8px 0; }
    .track {
      position: relative;
      height: 22px;
      background: var(--surface-3);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--line);
    }
    .fill { height: 100%; }
    .fill span {
      position: absolute;
      right: 8px;
      top: 2px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--prefill-ink);
    }
    .fill.decode span { color: var(--decode-ink); }
    .fill.prefill { background: color-mix(in srgb, var(--good-fill) 28%, transparent); }
    .fill.decode { background: color-mix(in srgb, var(--decode) 24%, transparent); }
    footer { color: var(--caption); font-size: 0.8125rem; margin: 20px 0 48px; line-height: 1.5; }
    @media (max-width: 720px) {
      header, main { width: min(68rem, calc(100% - 24px)); }
      header { padding-top: 2.5rem; }
      .tabs { display: flex; overflow-x: auto; max-width: 100%; border-radius: var(--radius); }
    }
  </style>
</head>
<body>
  <header>
    <p class="kicker" id="kicker">AI624 · Project A1</p>
    <h1 id="title">Baseline</h1>
    <p class="sub" id="subtitle">Loading runs</p>
    <p class="meta-line" id="meta-line"></p>
    <div class="chips" id="chips"></div>
  </header>
  <main id="main"></main>
  <script>
    const TABS = [
      ["overview", "Overview"],
      ["held_out", "Held-out"],
      ["sweep", "Sweep"],
    ];
    const KIND = {
      long_task: "Long task",
      harness: "Harness",
      held_out: "Held-out",
      sweep: "Sweep",
      power: "Power",
      harness: "Harness",
      train: "Train",
    };
    const CHART = {
      prefill: "#3a843f",
      decode: "#2c67c5",
      power: "#53b559",
      temp: "#539af8",
      grid: "#0000001f",
      axis: "#8f8f8f",
      mark: "#95611f",
    };
    const state = {
      tab: (location.hash || "#overview").slice(1),
      picked: {},
    };
    if (state.tab === "long_task") state.tab = "held_out";
    if (!TABS.some(([id]) => id === state.tab)) state.tab = "overview";

    const $ = (id) => document.getElementById(id);

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[ch]));
    }

    function num(value, digits = 0) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) return "—";
      return Number(value).toLocaleString(undefined, {
        maximumFractionDigits: digits,
        minimumFractionDigits: digits,
      });
    }

    function ms(value) {
      return value === null || value === undefined ? "—" : `${num(value, value >= 100 ? 0 : 1)} ms`;
    }

    function toks(value) {
      return value === null || value === undefined ? "—" : `${num(value, 1)} tok/s`;
    }

    function bytes(value) {
      if (value === null || value === undefined) return "—";
      const mib = Number(value) / (1024 * 1024);
      return `${num(mib, mib >= 100 ? 0 : 1)} MiB`;
    }

    function joules(value) {
      return value === null || value === undefined ? "—" : `${num(value, 1)} J`;
    }

    function sampleEvery(intervalS) {
      const seconds = Number(intervalS);
      if (!Number.isFinite(seconds) || seconds <= 0) return "10 min";
      if (seconds >= 60) {
        const minutes = seconds / 60;
        return `${num(minutes, minutes >= 10 || Number.isInteger(minutes) ? 0 : 1)} min`;
      }
      return `${num(seconds, 0)} s`;
    }

    function celsius(value) {
      return value === null || value === undefined ? "—" : `${num(value, 1)} °C`;
    }

    function median(values) {
      const nums = values.filter((value) => typeof value === "number" && !Number.isNaN(value)).sort((a, b) => a - b);
      if (!nums.length) return null;
      const mid = Math.floor(nums.length / 2);
      return nums.length % 2 ? nums[mid] : (nums[mid - 1] + nums[mid]) / 2;
    }

    function byDate(a, b) {
      return String(a.started_at || a.id).localeCompare(String(b.started_at || b.id));
    }

    function when(iso) {
      if (!iso) return "—";
      const date = new Date(iso);
      if (Number.isNaN(date.getTime())) return iso;
      return date.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    }

    function turnsOf(run) {
      return (run.sessions || []).flatMap((session) => session.turns || []);
    }

    function medianPrefill(run) {
      return median(turnsOf(run).map((turn) => turn.prefill_ms));
    }

    function medianDecode(run) {
      return median(turnsOf(run).map((turn) => turn.decode_ms));
    }

    function callStats(run) {
      const ok = (run.sessions || []).reduce((sum, session) => sum + (session.calls_ok || 0), 0);
      const total = (run.sessions || []).reduce((sum, session) => sum + (session.calls_total || 0), 0);
      return { ok, total };
    }

    function delta(current, previous, lowerIsBetter) {
      if (typeof current !== "number" || typeof previous !== "number" || previous === 0) return "";
      const pct = ((current - previous) / Math.abs(previous)) * 100;
      const rounded = Math.round(pct);
      if (rounded === 0) return "";
      const improved = lowerIsBetter ? rounded < 0 : rounded > 0;
      const sign = rounded > 0 ? "+" : "";
      return `<span class="delta ${improved ? "good" : "bad"}">${sign}${rounded}%</span>`;
    }

    function ratioMultiplier(current, previous, lowerIsBetter) {
      if (typeof current !== "number" || typeof previous !== "number" || !current || !previous) return "";
      const ratio = lowerIsBetter ? previous / current : current / previous;
      if (!Number.isFinite(ratio) || ratio < 1.05) return "";
      const improved = ratio >= 1.05;
      const sign = lowerIsBetter ? (previous > current) : (current > previous);
      if (!sign) return "";
      return `<p class="stat-mult${improved ? "" : " badish"}">≈${ratio.toFixed(1)}×</p>`;
    }

    function vsLine(current, previous, format) {
      if (current === null || current === undefined || Number.isNaN(current)) return "—";
      if (previous === null || previous === undefined || previous === "" || Number.isNaN(previous)) return format(current);
      return `${format(current)} vs. ${format(previous)}`;
    }

    function statCard(label, multiplier, detail) {
      return `<article class="stat-card">
        <p class="stat-label">${esc(label)}</p>
        ${multiplier || ""}
        <p class="stat-detail">${detail}</p>
      </article>`;
    }

    function runStats(run, previous) {
      const calls = callStats(run);
      const rate = calls.total ? calls.ok / calls.total : null;
      const prevCalls = previous ? callStats(previous) : null;
      const prevRate = prevCalls && prevCalls.total ? prevCalls.ok / prevCalls.total : null;
      const mp = medianPrefill(run);
      const md = medianDecode(run);
      const energy = run.device && run.device.energy_j;
      const prevEnergy = previous && previous.device && previous.device.energy_j;
      const temp = run.device && run.device.temp_c_max;
      const prevTemp = previous && previous.device && previous.device.temp_c_max;
      return `<div class="stat-grid">
        ${statCard(
          "Median prefill",
          ratioMultiplier(mp, previous && medianPrefill(previous), true),
          vsLine(mp, previous && medianPrefill(previous), (value) => ms(value))
        )}
        ${statCard(
          "Median decode",
          ratioMultiplier(md, previous && medianDecode(previous), true),
          vsLine(md, previous && medianDecode(previous), (value) => ms(value))
        )}
        ${statCard(
          "Valid tool calls",
          ratioMultiplier(rate, prevRate, false),
          calls.total ? vsLine(rate, prevRate, (value) => `${num((value || 0) * 100, 0)}% (${calls.ok}/${calls.total})`) : "—"
        )}
        ${statCard(
          "Run energy",
          ratioMultiplier(energy, prevEnergy, true),
          vsLine(energy, prevEnergy, joules)
        )}
        ${statCard(
          "Peak temperature",
          ratioMultiplier(temp, prevTemp, true),
          vsLine(temp, prevTemp, celsius)
        )}
      </div>`;
    }

    function runMeta(run, baseline) {
      const parts = [
        baseline.model_family && baseline.model_size ? `${baseline.model_family}-${baseline.model_size}` : null,
        baseline.gguf,
        baseline.context_size ? `${num(baseline.context_size, 0)} ctx` : null,
        baseline.threads ? `${baseline.threads} threads` : null,
        baseline.cache_prompt === false ? "cache_prompt false" : (baseline.cache_prompt === true ? "cache_prompt true" : null),
        KIND[run.kind] || run.kind,
        when(run.started_at),
      ].filter(Boolean);
      return parts.join(" · ");
    }

    function headlineStats(runs, prior) {
      const kinds = ["held_out", "sweep"];
      const picks = kinds.map((kind) => {
        const ofKind = runs.filter((run) => run.kind === kind).sort(byDate);
        return ofKind.length ? ofKind[ofKind.length - 1] : null;
      }).filter(Boolean);
      if (!picks.length) return "";
      const cards = picks.map((run) => {
        const previous = prior[run.id];
        const mp = medianPrefill(run);
        const md = medianDecode(run);
        const label = `${KIND[run.kind] || run.kind} · latest`;
        let multiplier = "";
        let detail = `${ms(mp)} prefill · ${ms(md)} decode`;
        if (run.kind !== "sweep" && typeof mp === "number" && previous && typeof medianPrefill(previous) === "number") {
          multiplier = ratioMultiplier(mp, medianPrefill(previous), true);
          detail = vsLine(mp, medianPrefill(previous), ms);
        } else if (run.kind === "sweep") {
          const rows = (run.characterization && run.characterization.measurements) || [];
          const peak = rows.reduce((best, row) => Math.max(best, row.predicted_per_second || 0), 0);
          const prevRows = previous && previous.characterization && previous.characterization.measurements;
          const prevPeak = prevRows ? prevRows.reduce((best, row) => Math.max(best, row.predicted_per_second || 0), 0) : null;
          multiplier = ratioMultiplier(peak, prevPeak, false);
          detail = peak ? `${toks(peak)} peak decode${prevPeak ? ` vs. ${toks(prevPeak)}` : ""}` : "—";
        }
        return statCard(label, multiplier, detail);
      }).join("");
      return `<section class="panel hero-panel"><h2>Latest measurements</h2><div class="stat-grid">${cards}</div><p class="note">Uppercase metric labels, ≈N× multipliers, and vs. lines compare each latest run with the previous run of the same kind.</p></section>`;
    }

    function previousOf(runs) {
      const map = {};
      const last = {};
      [...runs].sort(byDate).forEach((run) => {
        map[run.id] = last[run.kind] || null;
        last[run.kind] = run;
      });
      return map;
    }

    function tabs() {
      return `<nav class="tabs">${TABS.map(([id, label]) =>
        `<button type="button" data-tab="${id}" aria-selected="${state.tab === id}">${label}</button>`
      ).join("")}</nav>`;
    }

    function dateStrip(runs, kind) {
      if (!runs.length) return "";
      const current = selected(runs, kind);
      return `<div class="dates">${[...runs].sort(byDate).map((run) =>
        `<button type="button" data-kind="${esc(kind)}" data-run="${esc(run.id)}" aria-pressed="${run.id === current.id}">${esc(when(run.started_at))}</button>`
      ).join("")}</div>`;
    }

    function selected(runs, kind) {
      const ordered = [...runs].sort(byDate);
      const wanted = state.picked[kind];
      return ordered.find((run) => run.id === wanted) || ordered[ordered.length - 1];
    }

    function lineChart(series, yLabel, caption) {
      const points = series.flatMap((item) => item.points);
      if (points.length < 2) return "";
      const width = 720;
      const height = 200;
      const padL = 48;
      const padR = 12;
      const padT = 16;
      const padB = 28;
      const plotW = width - padL - padR;
      const plotH = height - padT - padB;
      const ys = points.map((point) => point.y);
      const yLo = Math.min(...ys);
      const yHi = Math.max(...ys);
      const span = (yHi - yLo) || 1;
      const min = yLo - span * 0.12;
      const max = yHi + span * 0.12;
      const labels = [];
      series.forEach((item) => item.points.forEach((point) => {
        if (!labels.includes(point.x)) labels.push(point.x);
      }));
      const xOf = (label) => {
        const index = Math.max(0, labels.indexOf(label));
        const denom = Math.max(1, labels.length - 1);
        return padL + (index / denom) * plotW;
      };
      const yOf = (value) => padT + (1 - (value - min) / (max - min)) * plotH;
      const paths = series.map((item) => {
        const path = item.points.map((point, index) =>
          `${index ? "L" : "M"}${xOf(point.x).toFixed(1)},${yOf(point.y).toFixed(1)}`
        ).join(" ");
        const dots = item.points.map((point) =>
          `<circle cx="${xOf(point.x).toFixed(1)}" cy="${yOf(point.y).toFixed(1)}" r="3" fill="${item.color}"/>`
        ).join("");
        return `<path d="${path}" fill="none" stroke="${item.color}" stroke-width="2"/>${dots}`;
      }).join("");
      const xLabels = labels.filter((_, index) => labels.length <= 6 || index === 0 || index === labels.length - 1 || index % Math.ceil(labels.length / 6) === 0);
      const captionUpper = String(caption).split(".")[0];
      return `<figure class="figure">
        <svg class="trace" viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(yLabel)}">
          <line x1="${padL}" y1="${padT + plotH}" x2="${padL + plotW}" y2="${padT + plotH}" stroke="${CHART.grid}"/>
          ${paths}
          <text x="4" y="14" fill="${CHART.axis}" font-size="11">${esc(yLabel)}</text>
          <text x="${padL}" y="${height - 8}" fill="${CHART.axis}" font-size="11">${esc(xLabels[0] || "")}</text>
          <text x="${padL + plotW}" y="${height - 8}" text-anchor="end" fill="${CHART.axis}" font-size="11">${esc(xLabels[xLabels.length - 1] || "")}</text>
        </svg>
        <p class="figure-caption">${esc(captionUpper)}</p>
        <div class="legend">${series.map((item) => `<span><i class="swatch" style="background:${item.color}"></i>${esc(item.name)}</span>`).join("")}</div>
        <p class="note">${caption}</p>
      </figure>`;
    }

    function powerChart(device) {
      const points = ((device && device.series) || []).filter((point) => typeof point.t_s === "number");
      if (points.length < 2) return "";
      const width = 720;
      const height = 200;
      const padL = 46;
      const padR = 46;
      const padT = 16;
      const padB = 28;
      const plotW = width - padL - padR;
      const plotH = height - padT - padB;
      const tMax = Math.max(...points.map((point) => point.t_s), 1);
      const powers = points.map((point) => point.power_w).filter((value) => typeof value === "number");
      const temps = points.map((point) => point.temp_c).filter((value) => typeof value === "number");
      const domain = (lo, hi) => {
        const span = (hi - lo) || 1;
        return [lo - span * 0.18, hi + span * 0.18];
      };
      const pLo = powers.length ? Math.min(...powers) : 0;
      const pHi = powers.length ? Math.max(...powers) : 1;
      const cLo = temps.length ? Math.min(...temps) : 0;
      const cHi = temps.length ? Math.max(...temps) : 1;
      const [pMin, pMax] = domain(pLo, pHi);
      const [cMin, cMax] = domain(cLo, cHi);
      const xOf = (t) => padL + (t / tMax) * plotW;
      const yOf = (value, min, max) => padT + (1 - (value - min) / ((max - min) || 1)) * plotH;
      const pathFor = (key, min, max) => {
        let drawing = false;
        let path = "";
        points.forEach((point) => {
          if (typeof point[key] !== "number") {
            drawing = false;
            return;
          }
          path += `${drawing ? "L" : "M"}${xOf(point.t_s).toFixed(1)},${yOf(point[key], min, max).toFixed(1)} `;
          drawing = true;
        });
        return path.trim();
      };
      const marks = ((device && device.marks) || []).filter((mark) => typeof mark.t_s === "number").map((mark) => {
        const x = xOf(Math.max(0, Math.min(mark.t_s, tMax)));
        return `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${padT}" y2="${padT + plotH}" stroke="${CHART.mark}" stroke-dasharray="3 3"/>`;
      }).join("");
      return `<figure class="figure">
        <svg class="trace" viewBox="0 0 ${width} ${height}" role="img" aria-label="Power and temperature during the run">
          <line x1="${padL}" y1="${padT + plotH}" x2="${padL + plotW}" y2="${padT + plotH}" stroke="${CHART.grid}"/>
          <path d="${pathFor("power_w", pMin, pMax)}" fill="none" stroke="${CHART.power}" stroke-width="2"/>
          <path d="${pathFor("temp_c", cMin, cMax)}" fill="none" stroke="${CHART.temp}" stroke-width="2"/>
          ${marks}
          <text x="${padL}" y="12" fill="${CHART.axis}" font-size="11">${num(pHi, 1)} W</text>
          <text x="${width - 8}" y="12" text-anchor="end" fill="${CHART.axis}" font-size="11">${num(cHi, 1)} °C</text>
          <text x="${padL}" y="${height - 8}" fill="${CHART.axis}" font-size="11">0s</text>
          <text x="${padL + plotW}" y="${height - 8}" text-anchor="end" fill="${CHART.axis}" font-size="11">${num(tMax, 0)}s</text>
        </svg>
        <p class="figure-caption">Power and temperature trace</p>
        <div class="legend"><span><i class="swatch" style="background:${CHART.power}"></i>power</span><span><i class="swatch" style="background:${CHART.temp}"></i>temperature</span></div>
        <p class="note">Power (W) and temperature (°C) sampled about every ${sampleEvery(device && device.interval_s)} for this run. Source: vcgencmd rail power and measure_temp.</p>
      </figure>`;
    }

    function deviceFacts(device) {
      if (!device) return "";
      const during = device.throttled_during || [];
      const since = device.throttled_since_boot || [];
      const throttle = during.length
        ? `${device.throttled || ""} during run: ${during.join(", ")}`
        : (since.length ? `${device.throttled || ""} since boot: ${since.join(", ")}` : "—");
      return `<p class="note">Peak RSS ${bytes(device.peak_memory_bytes)} · energy ${joules(device.energy_j)} · temp max ${celsius(device.temp_c_max)} · ${esc(throttle)}</p>`;
    }

    function sessionTable(run) {
      const sessions = run.sessions || [];
      if (!sessions.length) return "<p class='empty'>No harness sessions in this run.</p>";
      const rows = sessions.map((session) => {
        const sessionTurns = session.turns || [];
        const body = sessionTurns.map((turn) => {
          const ok = (turn.call_validity || []).filter((item) => item.ok).length;
          const total = (turn.call_validity || []).length;
          return `<tr>
            <td>${turn.turn_index ?? "—"}</td>
            <td class="num">${turn.prompt_tokens ?? "—"}</td>
            <td class="num">${ms(turn.prefill_ms)}</td>
            <td class="num">${ms(turn.decode_ms)}</td>
            <td class="num">${ms(turn.tool_ms)}</td>
            <td class="num">${total ? `${ok}/${total}` : "—"}</td>
          </tr>`;
        }).join("");
        return `<tr>
          <td><code>${esc(session.task_id)}</code></td>
          <td>${session.success === true ? '<span class="good">yes</span>' : session.success === false ? '<span class="bad">no</span>' : "n/a"}</td>
          <td class="num">${session.calls_total ? `${session.calls_ok}/${session.calls_total}` : "—"}</td>
          <td class="num">${sessionTurns.length}</td>
          <td class="num">${ms(sessionTurns.reduce((sum, turn) => sum + (turn.prefill_ms || 0), 0))}</td>
          <td class="num">${ms(sessionTurns.reduce((sum, turn) => sum + (turn.decode_ms || 0), 0))}</td>
        </tr>
        <tr><td colspan="6"><details><summary>Turns</summary>
          <table><thead><tr><th>Turn</th><th class="num">Prompt</th><th class="num">Prefill</th><th class="num">Decode</th><th class="num">Tool</th><th class="num">Calls</th></tr></thead><tbody>${body}</tbody></table>
        </details></td></tr>`;
      }).join("");
      return `<table><thead><tr><th>Task</th><th>Success</th><th class="num">Calls</th><th class="num">Turns</th><th class="num">Prefill</th><th class="num">Decode</th></tr></thead><tbody>${rows}</tbody></table>`;
    }

    function sweepBars(run) {
      const rows = (run.characterization && run.characterization.measurements) || [];
      if (!rows.length) return "<p class='empty'>No sweep measurements in this run.</p>";
      const max = Math.max(1, ...rows.flatMap((row) => [row.prompt_per_second || 0, row.predicted_per_second || 0]));
      const bars = rows.map((row) => `<div class="bar-row"><div>${row.prompt_n || row.requested_tokens_approx || "?"} tok</div><div>
        <div class="track"><div class="fill prefill" style="width:${((row.prompt_per_second || 0) / max) * 100}%"><span>${toks(row.prompt_per_second)}</span></div></div>
        <div class="track" style="margin-top:4px"><div class="fill decode" style="width:${((row.predicted_per_second || 0) / max) * 100}%"><span>${toks(row.predicted_per_second)}</span></div></div>
      </div></div>`).join("");
      return `${bars}
        <div class="legend"><span><i class="swatch" style="background:${CHART.prefill}"></i>prefill</span><span><i class="swatch" style="background:${CHART.decode}"></i>decode</span></div>
        <p class="note">Prefill and decode throughput by prompt length. Source: llama-server timings, cache_prompt false.</p>`;
    }

    function sweepCompare(runs) {
      const ordered = [...runs].sort(byDate);
      if (ordered.length < 2) return "";
      const lengths = [];
      ordered.forEach((run) => ((run.characterization && run.characterization.measurements) || []).forEach((row) => {
        if (!lengths.includes(row.requested_tokens_approx)) lengths.push(row.requested_tokens_approx);
      }));
      lengths.sort((a, b) => a - b);
      const header = lengths.map((length) => `<th class="num">${length} decode</th>`).join("");
      let previous = null;
      const body = ordered.map((run) => {
        const cells = lengths.map((length) => {
          const row = ((run.characterization && run.characterization.measurements) || []).find((item) => item.requested_tokens_approx === length);
          const value = row ? row.predicted_per_second : null;
          const priorRow = previous && ((previous.characterization && previous.characterization.measurements) || []).find((item) => item.requested_tokens_approx === length);
          const prior = priorRow ? priorRow.predicted_per_second : null;
          return `<td class="num">${toks(value)}${delta(value, prior, false)}</td>`;
        }).join("");
        previous = run;
        return `<tr><td>${esc(when(run.started_at))}</td>${cells}</tr>`;
      }).join("");
      return `<h2>Decode throughput across dates</h2>
        <table><thead><tr><th>Run</th>${header}</tr></thead><tbody>${body}</tbody></table>
        <p class="note">Higher tok/s is better. The percent is versus the previous sweep at the same prompt length.</p>`;
    }

    function latencyTrend(runs) {
      const kinds = [["held_out", "Held-out", CHART.decode]];
      const series = kinds.map(([kind, name, color]) => ({
        name,
        color,
        points: runs.filter((run) => run.kind === kind).sort(byDate).flatMap((run) => {
          const y = medianPrefill(run);
          return typeof y === "number" ? [{ x: when(run.started_at), y }] : [];
        }),
      })).filter((item) => item.points.length);
      return lineChart(series, "Prefill (ms)", "Median prefill by run date. Lower is better. Source: harness turn timings.");
    }

    function kindTrend(runs, pick) {
      const points = [...runs].sort(byDate).flatMap((run) => {
        const y = pick(run);
        return typeof y === "number" ? [{ x: when(run.started_at), y }] : [];
      });
      return lineChart([{ name: "Median prefill", color: CHART.prefill, points }], "Median prefill (ms)", "Same benchmark on later dates. Lower is better.");
    }

    function overview(runs, prior) {
      const hero = headlineStats(runs, prior);
      const chart = latencyTrend(runs);
      const rows = [...runs].sort(byDate).reverse().map((run) => {
        const previous = prior[run.id];
        const calls = callStats(run);
        return `<tr>
          <td>${esc(when(run.started_at))}</td>
          <td>${esc(KIND[run.kind] || run.kind)}</td>
          <td class="num">${calls.total ? `${calls.ok}/${calls.total}` : "—"}${delta(calls.total ? calls.ok / calls.total : null, previous && callStats(previous).total ? callStats(previous).ok / callStats(previous).total : null, false)}</td>
          <td class="num">${ms(medianPrefill(run))}${delta(medianPrefill(run), previous && medianPrefill(previous), true)}</td>
          <td class="num">${ms(medianDecode(run))}${delta(medianDecode(run), previous && medianDecode(previous), true)}</td>
          <td class="num">${joules(run.device && run.device.energy_j)}</td>
          <td class="num">${celsius(run.device && run.device.temp_c_max)}</td>
        </tr>`;
      }).join("");
      return `${hero}
        ${chart ? `<section class="panel"><h2>Prefill over time</h2>${chart}</section>` : ""}
        <section class="panel"><h2>Every recorded run</h2>
          <table><thead><tr><th>Date</th><th>Tab</th><th class="num">Calls</th><th class="num">Prefill</th><th class="num">Decode</th><th class="num">Energy</th><th class="num">Temp max</th></tr></thead><tbody>${rows}</tbody></table>
          <p class="note">Percentages compare with the previous run of the same kind. Green means the later run improved.</p>
        </section>`;
    }

    function detail(runs, kind, baseline, prior) {
      if (!runs.length) {
        return `<section class="panel"><p class="empty">No ${esc(KIND[kind] || kind)} runs yet.</p></section>`;
      }
      const run = selected(runs, kind);
      const previous = prior[run.id];
      const trend = kind === "sweep" ? "" : kindTrend(runs, medianPrefill);
      const body = kind === "sweep"
        ? `${sweepBars(run)}${deviceFacts(run.device)}<div style="height:16px"></div>${sweepCompare(runs)}`
        : `${sessionTable(run)}${deviceFacts(run.device)}`;
      const command = (run.command || []).join(" ");
      return `<section class="panel">
        ${dateStrip(runs, kind)}
        <h2>${esc(when(run.started_at))}</h2>
        <p class="run-meta">${esc(runMeta(run, baseline))}</p>
        ${runStats(run, previous)}
        ${command ? `<p class="note"><code>${esc(command)}</code></p>` : ""}
        ${body}
        ${trend ? `<div style="height:8px"></div>${trend}` : ""}
        ${powerChart(run.device)}
      </section>`;
    }

    function steps() {
      return `<section class="panel"><h2>Record the next run</h2>
        <p class="note">Leave <code>./scripts/start_server.sh</code> running, then in a second terminal run <code>./scripts/run_baseline.sh</code>. It records one held-out harness task, the prefill/decode sweep, and power/temperature beside each step, then writes <code>docs/data/dashboard.json</code>.</p>
        <p class="note">With <code>export</code> enabled in <code>baseline.yaml</code>, <code>run_baseline.sh</code> refreshes <code>dashboard.json</code> after each held-out session and after the sweep finishes. Commit and push to update this page.</p></section>`;
    }

    function render(data) {
      window.__data = data;
      const runs = Array.isArray(data.runs) ? data.runs : [];
      const baseline = data.baseline || {};
      const server = data.server || {};
      $("kicker").textContent = data.project ? `${data.project.course} · ${data.project.track}` : "AI624 · Project A1";
      $("title").textContent = data.project ? data.project.name : "Baseline";
      const modelLabel = `${baseline.model_family || "Qwen3"}-${baseline.model_size || "1.7B"}`;
      $("subtitle").textContent = runs.length
        ? `${runs.length} dated run${runs.length === 1 ? "" : "s"} on Raspberry Pi 5 — edge tool-calling baseline`
        : "No dated runs yet";
      $("meta-line").textContent = [
        data.project && data.project.course,
        modelLabel,
        server.model_ftype || "BF16",
        `${server.n_ctx || baseline.context_size || "?"} ctx`,
        baseline.cache_prompt === false ? "cache_prompt false" : `cache_prompt ${baseline.cache_prompt}`,
      ].filter(Boolean).join(" · ");
      $("chips").innerHTML = [
        ["Model", modelLabel],
        ["Weights", server.model_ftype || "BF16"],
        ["Context", server.n_ctx || baseline.context_size],
        ["Threads", baseline.threads],
        ["cache_prompt", String(baseline.cache_prompt)],
      ].map(([label, value]) => `<span class="chip">${label} <strong>${esc(value)}</strong></span>`).join("");

      const prior = previousOf(runs);
      let body;
      if (!runs.length) body = steps();
      else if (state.tab === "overview") body = overview(runs, prior) + steps();
      else body = detail(runs.filter((run) => run.kind === state.tab), state.tab, baseline, prior);
      $("main").innerHTML = `${tabs()}${body}<footer>Each run is kept. Export merges <code>results/baseline/history/</code> into <code>docs/data/dashboard.json</code>.</footer>`;
    }

    $("main").addEventListener("click", (event) => {
      const tab = event.target.closest("[data-tab]");
      if (tab) {
        state.tab = tab.dataset.tab;
        history.replaceState(null, "", `#${state.tab}`);
        render(window.__data);
        return;
      }
      const pick = event.target.closest("[data-run]");
      if (pick && window.__data) {
        state.picked[pick.dataset.kind] = pick.dataset.run;
        render(window.__data);
      }
    });

    fetch(`data/dashboard.json?v=${Date.now()}`, { cache: "no-store" })
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then(render)
      .catch((error) => {
        $("subtitle").textContent = `Could not load data/dashboard.json (${error.message}).`;
        $("main").innerHTML = steps();
      });
  </script>
</body>
</html>
